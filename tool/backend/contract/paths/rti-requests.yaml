  # Update an existing RTI request
  put:
    summary: Update an RTI request
    operationId: updateRTIRequest
    description: Fully replaces an RTI request identifying it by UUID.
    tags:
      - RTI Requests
    security:
      - opaqueBearerToken: []
    parameters:
      - $ref: "../components/parameters/object.yaml#/ObjectId"
    requestBody:
      required: true
      description: JSON request body with updated RTI request data.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/RTIRequests.yaml#/RTIRequestRequest"
    responses:
      "200":
        description: RTI request updated successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/RTIRequests.yaml#/RTIRequestResponse"
            example:
              id: 8cba6e9e-7b9c-4c9c-979d-ecb668a6df9c
              title: Updated Request Title
              description: Updated description for the RTI request.
              sender:
                id: 1605661f-f0df-49c2-b861-8652c5b727fd
                name: Bimali Silva
                email: bimali.s@example.com
                address: Gampaha
                contactNo: "0712345678"
              receiver:
                id: fbbdd56c-4db5-4d43-9d0a-8a3c82e4c2c9
                position:
                  id: f31625cc-c130-4295-959a-c4c1aea7fd94
                  name: Designated Officer
                institution:
                  id: e9c6313c-5652-4100-be75-68e7382b4fad
                  name: Department of Education
                email: do.edu.updated@gov.lk
                address: null
                contactNo: null
              rtiTemplate:
                id: b402c17a-8b25-4514-ba17-6b1ff79a0f08
                title: Education Data Request
                file: templates/v2/edu_data.pdf
              createdAt: "2026-03-31T09:00:00Z"
              updatedAt: "2026-04-01T10:00:00Z"
