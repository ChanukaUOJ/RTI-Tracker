      "404":
        $ref: "../components/responses/Errors.yaml#/NotFound"
      "422":
        $ref: "../components/responses/Errors.yaml#/UnprocessableEntity"
      "500":
        $ref: "../components/responses/Errors.yaml#/InternalServerError"

  # Delete an RTI request
  delete:
    summary: Delete an RTI request
    operationId: deleteRTIRequest
    description: Permanently deletes an RTI request by UUID. Returns 204 No Content
      on success. If the resource is linked with other resources (e.g., status
      history), it cannot be deleted.
    tags:
      - RTI Requests
    security:
      - opaqueBearerToken: []
    parameters:
      - $ref: "../components/parameters/object.yaml#/ObjectId"
    responses:
      "204":
        description: RTI request deleted successfully. No content returned.
      "401":
        $ref: "../components/responses/Errors.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/Errors.yaml#/NotFound"
      "409":
        $ref: "../components/responses/Errors.yaml#/Conflict"
      "500":
        $ref: "../components/responses/Errors.yaml#/InternalServerError"
