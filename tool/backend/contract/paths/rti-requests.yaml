    tags:
      - RTI Requests
    security:
      - opaqueBearerToken: []
    parameters:
      - $ref: "../components/parameters/object.yaml#/ObjectId"
    responses:
      "200":
        description: RTI request found and returned successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/RTIRequests.yaml#/RTIRequestResponse"
            example:
