/rti_requests:
  # Create a new RTI request
  post:
    summary: Create an RTI request
    operationId: createRTIRequest
    description: Creates a new RTI request record linking a sender, receiver, and
      optionally an RTI template.
    tags:
      - RTI Requests
    security:
      - opaqueBearerToken: []
    requestBody:
      required: true
      description: JSON request body with RTI request metadata.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/RTIRequests.yaml#/RTIRequestRequest"
    responses:
      "201":
        description: RTI request created successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/RTIRequests.yaml#/RTIRequestResponse"
            example:
              id: 8cba6e9e-7b9c-4c9c-979d-ecb668a6df9c
              title: School Expenditure 2024
              description: Requesting budget allocation for primary schools in Jaffna.
              sender:
                id: 1605661f-f0df-49c2-b861-8652c5b727fd
                name: Bimali Silva
                email: bimali.s@example.com
                address: Gampaha
                contactNo: "0712345678"
              receiver:
                id: fbbdd56c-4db5-4d43-9d0a-8a3c82e4c2c9
                position:
                  id: f31625cc-c130-4295-959a-c4c1aea7fd94
                  name: Designated Officer
                institution:
                  id: e9c6313c-5652-4100-be75-68e7382b4fad
                  name: Department of X
                email: example@gov.lk
                address: null
                contactNo: null
              rtiTemplate:
                id: b402c17a-8b25-4514-ba17-6b1ff79a0f08
                title: Education Data Request
                file: templates/v2/edu_data.pdf
              createdAt: "2026-05-09T03:14:44.547287Z"
              updatedAt: "2026-05-09T03:14:44.547287Z"
      "401":
        $ref: "../components/responses/Errors.yaml#/Unauthorized"
      "422":
        $ref: "../components/responses/Errors.yaml#/UnprocessableEntity"
      "500":
        $ref: "../components/responses/Errors.yaml#/InternalServerError"

  # List all RTI requests with pagination
  get:
    summary: List all RTI requests
    operationId: listRTIRequests
    description: Returns a paginated list of all RTI requests.
    tags:
      - RTI Requests
    security:
      - opaqueBearerToken: []
    parameters:
      - $ref: "../components/parameters/Pagination.yaml#/PageParam"
      - $ref: "../components/parameters/Pagination.yaml#/PageSizeParam"
      - $ref: "../components/parameters/Pagination.yaml#/SearchQueryParam"
    responses:
      "200":
        description: A paginated list of RTI requests.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/RTIRequests.yaml#/RTIRequestListResponse"
            example:
              data:
                - id: 8cba6e9e-7b9c-4c9c-979d-ecb668a6df9c
                  title: School Expenditure 2024
                  description: Requesting budget allocation for primary schools in Jaffna.
                  sender:
                    id: 1605661f-f0df-49c2-b861-8652c5b727fd
                    name: Bimali Silva
                    email: bimali.s@example.com
                    address: Gampaha
                    contactNo: "0712345678"
                  receiver:
                    id: fbbdd56c-4db5-4d43-9d0a-8a3c82e4c2c9
                    position:
                      id: f31625cc-c130-4295-959a-c4c1aea7fd94
                      name: Designated Officer
                    institution:
                      id: e9c6313c-5652-4100-be75-68e7382b4fad
                      name: Department of Education
                    email: do.edu.updated@gov.lk
                    address: null
                    contactNo: null
                  rtiTemplate:
