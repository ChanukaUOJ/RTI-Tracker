components:
  securitySchemes:
    opaqueBearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque bearer token. Pass as `Authorization: Bearer <token>`.
  schemas:
    RTIStatusRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Delivery
          description: Name of the status.
    RTIStatusResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: Unique identifier of the RTI status.
        name:
          type: string
          example: Delivery
          description: Name of the status.
        createdAt:
          type: string
          format: date-time
          example: '2026-03-31T09:00:00Z'
          description: ISO 8601 timestamp of when the status was created (UTC).
        updatedAt:
          type: string
          format: date-time
          example: '2026-03-31T09:00:00Z'
          description: ISO 8601 timestamp of when the status was last updated (UTC).
    RTIStatusListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RTIStatusResponse'
          description: List of RTI statuses for the current page.
        pagination:
          $ref: '#/components/schemas/Pagination'
    RTITemplateRequest:
      type: object
      required:
        - title
        - file
      properties:
        title:
          type: string
          example: Freedom of Information Request Template
          description: Human-readable title for the RTI template.
        description:
          type: string
          example: A standard template for filing RTI requests related to public expenditure.
          description: Detailed description of the RTI template.
        file:
          type: string
          format: binary
          description: Template document to upload (Markdown file). Will be stored on GitHub.
    RTITemplateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: Unique identifier of the RTI template.
        title:
          type: string
          example: Freedom of Information Request Template
          description: Title of the RTI template.
        description:
          type: string
          example: A standard template for filing RTI requests related to public expenditure.
          description: Description of the RTI template.
        file:
          type: string
          example: templates/3fa85f64.md
          description: Relative path to the uploaded file.
        createdAt:
          type: string
          format: date-time
          example: '2026-03-31T09:00:00Z'
          description: ISO 8601 timestamp of when the template was created (UTC).
        updatedAt:
          type: string
          format: date-time
          example: '2026-03-31T09:00:00Z'
          description: ISO 8601 timestamp of when the template was last updated (UTC).
    RTITemplateListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RTITemplateResponse'
          description: List of RTI templates for the current page.
        pagination:
          $ref: '#/components/schemas/Pagination'
    RTIRequestRequest:
      type: object
      properties:
        title:
          type: string
          example: Request for Budget Information 2024
          description: Human-readable title for the RTI request.
        description:
          type: string
          example: Requesting documents related to the 2024 healthcare budget regarding medical supplies.
          description: Detailed description of the RTI request.
        senderId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: ID of the sender making the request.
        receiverId:
