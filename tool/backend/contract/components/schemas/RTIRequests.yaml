RTIRequestRequest:
  type: object
  properties:
    title:
      type: string
      example: Request for Budget Information 2024
      description: Human-readable title for the RTI request.
    description:
      type: string
      example: Requesting documents related to the 2024 healthcare budget regarding
        medical supplies.
      description: Detailed description of the RTI request.
    senderId:
      type: string
      format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: ID of the sender making the request.
    receiverId:
      type: string
      format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: ID of the receiver (institution/official) the request is sent to.
    rtiTemplateId:
      type: string
      format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Optional ID of the RTI template used to generate this request.

RTIRequestResponse:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Unique identifier of the RTI request.
    title:
      type: string
      example: Request for Budget Information 2024
      description: Title of the RTI request.
    description:
      type: string
      example: Requesting documents related to the 2024 healthcare budget regarding
        medical supplies.
      description: Description of the RTI request.
    sender:
      $ref: "senders.yaml#/SenderShortResponse"
    receiver:
      $ref: "receivers.yaml#/ReceiverShortResponse"
    rtiTemplate:
      $ref: "RTITemplates.yaml#/RTITemplateShortResponse"
    createdAt:
      type: string
      format: date-time
      example: "2026-03-31T09:00:00Z"
      description: ISO 8601 timestamp of when the request was created (UTC).
    updatedAt:
      type: string
      format: date-time
      example: "2026-03-31T09:00:00Z"
      description: ISO 8601 timestamp of when the request was last updated (UTC).

RTIRequestExpandedResponse:
  allOf:
    - $ref: "#/RTIRequestResponse"
    - type: object
      properties:
        currentStatus:
          oneOf:
            - $ref: "rti-statuses.yaml#/RTICurrentStatusResponse"
            - type: "null"
          description: The most recent RTI status of this request, or null if no status has been recorded yet.

RTIRequestListResponse:
  type: object
  required:
    - data
    - pagination
  properties:
    data:
      type: array
      items:
        $ref: "#/RTIRequestExpandedResponse"
      description: List of RTI requests for the current page.
    pagination:
      $ref: "common.yaml#/Pagination"
