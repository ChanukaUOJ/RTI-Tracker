openapi: 3.1.0

info:
  title: RTI Template API
  description: |
    API for managing RTI (Right to Information) Templates.
    Templates can be created with an attached file that is stored on GitHub.
    All endpoints are protected via opaque bearer token authentication.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

security:
  - opaqueBearerToken: []

paths:
  # rti template paths
  /rti-templates:
    $ref: "./paths/rti-templates.yaml#/~1rti-templates"
  /rti-templates/{id}:
    $ref: "./paths/rti-templates.yaml#/~1rti-templates~1{id}"

  # sender paths
  /senders:
    $ref: "./paths/senders.yaml#/~1senders"
  /senders/{id}:
    $ref: "./paths/senders.yaml#/~1senders~1{id}"

  # institutions paths
  /institutions:
    $ref: "./paths/institutions.yaml#/~1institutions"
  /institutions/{id}:
    $ref: "./paths/institutions.yaml#/~1institutions~1{id}"

  # positions paths
  /positions:
    $ref: "./paths/positions.yaml#/~1positions"
  /positions/{id}:
    $ref: "./paths/positions.yaml#/~1positions~1{id}"

  # rti request paths
  /rti_requests:
    $ref: "./paths/rti-requests.yaml#/~1rti_requests"
  /rti_requests/{id}:
    $ref: "./paths/rti-requests.yaml#/~1rti_requests~1{id}"

  # rti request history paths
  /rti_requests/{rti_id}/histories:
    $ref: "./paths/rti-request-histories.yaml#/~1rti_requests~1{rti_id}~1histories"
  /rti_requests/{rti_id}/histories/{history_id}:
    $ref: "./paths/rti-request-histories.yaml#/~1rti_requests~1{rti_id}~1histories~\
      1{history_id}"

  # receivers paths
  /receivers:
    $ref: "./paths/receivers.yaml#/~1receivers"
  /receivers/{id}:
    $ref: "./paths/receivers.yaml#/~1receivers~1{id}"

  # rti statuses paths
  /rti_statuses:
    $ref: "./paths/rti-statuses.yaml#/~1rti_statuses"
  /rti_statuses/{id}:
    $ref: "./paths/rti-statuses.yaml#/~1rti_statuses~1{id}"

components:
  securitySchemes:
    opaqueBearerToken:
      $ref: "./components/securitySchemes/security.yaml#/opaqueBearerToken"
  schemas:
    RTIStatusRequest:
      $ref: "./components/schemas/rti-statuses.yaml#/RTIStatusRequest"
    RTIStatusResponse:
      $ref: "./components/schemas/rti-statuses.yaml#/RTIStatusResponse"
    RTIStatusListResponse:
      $ref: "./components/schemas/rti-statuses.yaml#/RTIStatusListResponse"
    RTITemplateRequest:
      $ref: "./components/schemas/RTITemplates.yaml#/RTITemplateRequest"
    RTITemplateResponse:
      $ref: "./components/schemas/RTITemplates.yaml#/RTITemplateResponse"
    RTITemplateListResponse:
      $ref: "./components/schemas/RTITemplates.yaml#/RTITemplateListResponse"
    RTIRequestRequest:
      $ref: "./components/schemas/RTIRequests.yaml#/RTIRequestRequest"
    RTIRequestResponse:
      $ref: "./components/schemas/RTIRequests.yaml#/RTIRequestResponse"
    RTIRequestExpandedResponse:
      $ref: "./components/schemas/RTIRequests.yaml#/RTIRequestExpandedResponse"
    RTIRequestListResponse:
      $ref: "./components/schemas/RTIRequests.yaml#/RTIRequestListResponse"
    RTIRequestHistoryRequest:
      $ref: "./components/schemas/rti-request-histories.yaml#/RTIRequestHistoryReques\
        t"
    RTIRequestHistoryUpdateRequest:
      $ref: "./components/schemas/rti-request-histories.yaml#/RTIRequestHistoryUpdate\
        Request"
    RTIRequestHistoryResponse:
      $ref: "./components/schemas/rti-request-histories.yaml#/RTIRequestHistoryRespon\
        se"
    RTIRequestHistoryListResponse:
      $ref: "./components/schemas/rti-request-histories.yaml#/RTIRequestHistoryListRe\
        sponse"
    Pagination:
      $ref: "./components/schemas/common.yaml#/Pagination"
    ErrorResponse:
      $ref: "./components/schemas/common.yaml#/ErrorResponse"
  responses:
    Unauthorized:
      $ref: "./components/responses/Errors.yaml#/Unauthorized"
    NotFound:
      $ref: "./components/responses/Errors.yaml#/NotFound"
    UnprocessableEntity:
      $ref: "./components/responses/Errors.yaml#/UnprocessableEntity"
    Conflict:
      $ref: "./components/responses/Errors.yaml#/Conflict"
    InternalServerError:
      $ref: "./components/responses/Errors.yaml#/InternalServerError"
  parameters:
    ObjectId:
      $ref: "./components/parameters/object.yaml#/ObjectId"
    PageParam:
      $ref: "./components/parameters/Pagination.yaml#/PageParam"
    PageSizeParam:
      $ref: "./components/parameters/Pagination.yaml#/PageSizeParam"
    SearchQueryParam:
      $ref: "./components/parameters/Pagination.yaml#/SearchQueryParam"
